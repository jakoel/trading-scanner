name: Watchlist Scan

# GitHub Actions' native `schedule` trigger proved unreliable for this repo —
# observed both multi-hour-late fires and complete no-shows on consecutive
# days (schedule events are best-effort and can be delayed or dropped,
# especially for low-activity repos). The real trigger now lives outside
# GitHub: an external scheduler (cron-job.org) calls the REST API to fire
# `workflow_dispatch` at 16:00 Israel time daily, which runs on-demand with
# no queueing. See architecture.md for the exact setup.
#
# The external scheduler's POST body never sets `dry_run`, so it always
# defaults to false — production runs are unaffected by this input existing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip Telegram + data commit, print report to the job log)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check Telegram secrets (temporary diagnostic — remove after confirming)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN: present (length ${#TELEGRAM_BOT_TOKEN})"; else echo "TELEGRAM_BOT_TOKEN: MISSING"; fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then echo "TELEGRAM_CHAT_ID: present (length ${#TELEGRAM_CHAT_ID})"; else echo "TELEGRAM_CHAT_ID: MISSING"; fi

      - name: Run headless scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run scan:headless -- ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit updated bar data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bars.db data/signals.csv

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Update daily bar data"

          # A push made to main while this run was in flight (e.g. a manual
          # commit elsewhere) leaves our push non-fast-forward. Rebase onto
          # the latest main and retry rather than failing outright — these
          # are pure data-file commits, so conflicts are effectively
          # impossible.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push attempt $attempt failed (likely a race with another push to main) — retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done

          echo "Failed to push after retries."
          exit 1
