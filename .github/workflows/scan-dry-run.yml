name: Watchlist Scan (Dry Run)

# Manual debugging workflow — runs the scanner with --dry-run so the report
# prints to the job log instead of posting to the live Telegram channel.
# No commit step: any local data/bars.db or data/signals.csv changes made
# during the run are discarded with the ephemeral runner, so this is safe
# to trigger repeatedly while testing signal logic changes.
on:
  workflow_dispatch: {}

jobs:
  scan-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run headless scan (dry run)
        run: npm run scan:headless -- --dry-run
